---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cluster.x-k8s.io/provider: bootstrap-ck8s
    control-plane: controller-manager
  name: cabpck-bootstrap-controller-manager
  namespace: cabpck-system
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: bootstrap-ck8s
      control-plane: controller-manager
  template:
    metadata:
      labels:
        cluster.x-k8s.io/provider: bootstrap-ck8s
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-addr=127.0.0.1:8080
        - --enable-leader-election
        command:
        - /manager
        image: tinkerbell.azurecr.io/canonical/cluster-api-k8s/bootstrap-controller:pr-226
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      - args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:8080/
        - --v=10
        image: registry.k8s.io/kubebuilder/kube-rbac-proxy:v0.16.0
        name: kube-rbac-proxy
        ports:
        - containerPort: 8443
          name: https
      serviceAccountName: cabpck-bootstrap-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: cabpck-bootstrap-webhook-service-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    cluster.x-k8s.io/provider: bootstrap-ck8s
  name: cabpck-bootstrap-serving-cert
  namespace: cabpck-system
spec:
  dnsNames:
  - cabpck-bootstrap-webhook-service.cabpck-system.svc
  - cabpck-bootstrap-webhook-service.cabpck-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: cabpck-bootstrap-selfsigned-issuer
  secretName: cabpck-bootstrap-webhook-service-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    cluster.x-k8s.io/provider: bootstrap-ck8s
  name: cabpck-bootstrap-selfsigned-issuer
  namespace: cabpck-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
