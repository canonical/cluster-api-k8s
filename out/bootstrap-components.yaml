      - v1beta2
  group: bootstrap.cluster.x-k8s.io
  names:
    kind: CK8sConfig
    listKind: CK8sConfigList
    plural: ck8sconfigs
    singular: ck8sconfig
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: CK8sConfig is the Schema for the ck8sconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
